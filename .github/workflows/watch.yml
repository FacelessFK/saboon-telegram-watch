name: saboon watch

on:
  schedule:
    # offset from :00, when GitHub drops the most scheduled runs
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: saboon-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check saboon
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 watch.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        run: |
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "saboon-watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "update state"
            git push
          fi
